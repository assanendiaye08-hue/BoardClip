name: CI

on:
  pull_request:
  push:
    branches: [main]

permissions:
  contents: read

jobs:
  test:
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || true

      - name: Run tests
        run: ./Scripts/test.sh

      - name: Build release configuration
        run: swift build -c release --disable-automatic-resolution
