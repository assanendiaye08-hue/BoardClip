name: Release

# Tag a release: `git tag v0.2.0 && git push --tags`
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    # Requires the macOS 26 SDK (Liquid Glass APIs). Use the macOS 26 runner image;
    # change to `macos-latest` once that maps to macOS 26 on your account.
    runs-on: macos-26
    steps:
      - uses: actions/checkout@v4

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || true

      - name: Resolve version
        id: v
        run: echo "version=$(grep -Eo 'static let version = \"[^\"]+\"' Sources/BoardClip/App/AppInfo.swift | sed -E 's/.*\"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: ./Scripts/make-dmg.sh release

      - name: Sign appcast (EdDSA)
        if: ${{ secrets.SPARKLE_ED_PRIVATE_KEY != '' }}
        env:
          KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
        run: |
          ./Scripts/sign-update.sh tools   # fetch the Sparkle CLI tools (no throwaway key)
          TOOLS=.build/sparkle-tools/bin
          mkdir -p updates
          cp build/BoardClip-*.dmg updates/
          printf '%s' "$KEY" > ed_key
          "$TOOLS/generate_appcast" --ed-key-file ed_key \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            updates/
          cp updates/appcast.xml build/appcast.xml
          rm -f ed_key

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS=(build/BoardClip-*.dmg)
          [ -f build/appcast.xml ] && ASSETS+=(build/appcast.xml)
          # Idempotent: create the release, or update assets if it already exists.
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "BoardClip ${{ steps.v.outputs.version }}" --generate-notes \
            || gh release upload "$TAG" "${ASSETS[@]}" --clobber

# ── Optional: notarize for a Gatekeeper-clean first launch ──────────────────
# Add these secrets and a notarize step when you have a paid Apple Developer account:
#   APPLE_DEVELOPER_ID_P12 (base64), APPLE_DEVELOPER_ID_P12_PASSWORD,
#   APPLE_NOTARY_KEY/_KEY_ID/_ISSUER  → import cert, set BOARDCLIP_SIGN_IDENTITY,
#   then `xcrun notarytool submit --wait` + `xcrun stapler staple`.
