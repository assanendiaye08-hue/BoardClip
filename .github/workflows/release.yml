name: Release

# Cut a release: `git tag v0.2.0 && git push --tags`
# Requires GitHub's macOS 26 runner image (Liquid Glass / macOS 26 SDK). Until that's available
# on your account you can release locally with `Scripts/release.sh` instead.
on:
  push:
    tags: ["v*"]

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-26
    env:
      # secrets aren't allowed directly in `if:` conditions — surface it as an env var instead.
      SPARKLE_KEY: ${{ secrets.SPARKLE_ED_PRIVATE_KEY }}
      BOARDCLIP_SIGN_IDENTITY: ${{ vars.BOARDCLIP_SIGN_IDENTITY || 'BoardClip Dev' }}
      BOARDCLIP_REQUIRE_SIGNING: "1"
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Select Xcode 26
        run: sudo xcode-select -s /Applications/Xcode_26.app 2>/dev/null || true

      - name: Validate release metadata
        env:
          TAG: ${{ github.ref_name }}
        run: |
          VERSION="$(grep -Eo 'static let version = "[^"]+"' Sources/BoardClip/App/AppInfo.swift | sed -E 's/.*"([^"]+)".*/\1/')"
          if [ "$TAG" != "v$VERSION" ]; then
            echo "Release tag $TAG does not match BoardClip version $VERSION."
            exit 1
          fi
          if [ -z "$SPARKLE_KEY" ]; then
            echo "Missing SPARKLE_ED_PRIVATE_KEY; refusing to publish an update without a signed appcast."
            exit 1
          fi

      - name: Run tests
        run: ./Scripts/test.sh

      - name: Import code-signing identity
        env:
          BOARDCLIP_CODESIGN_P12: ${{ secrets.BOARDCLIP_CODESIGN_P12 }}
          BOARDCLIP_CODESIGN_P12_PASSWORD: ${{ secrets.BOARDCLIP_CODESIGN_P12_PASSWORD }}
          KEYCHAIN_PASSWORD: ${{ github.run_id }}-${{ github.run_attempt }}
        run: |
          if [ -z "$BOARDCLIP_CODESIGN_P12" ] || [ -z "$BOARDCLIP_CODESIGN_P12_PASSWORD" ]; then
            echo "Missing BOARDCLIP_CODESIGN_P12 or BOARDCLIP_CODESIGN_P12_PASSWORD secret."
            echo "Export the stable BoardClip signing identity before cutting releases."
            exit 1
          fi

          KEYCHAIN_PATH="$RUNNER_TEMP/boardclip-signing.keychain-db"
          P12_PATH="$RUNNER_TEMP/boardclip-signing.p12"

          security create-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security set-keychain-settings -lut 21600 "$KEYCHAIN_PATH"
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security list-keychains -d user -s "$KEYCHAIN_PATH" $(security list-keychains -d user | sed -e 's/^[[:space:]]*//' -e 's/"//g')

          printf '%s' "$BOARDCLIP_CODESIGN_P12" | /usr/bin/base64 -D > "$P12_PATH"
          security import "$P12_PATH" -k "$KEYCHAIN_PATH" -P "$BOARDCLIP_CODESIGN_P12_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple:,codesign: -s -k "$KEYCHAIN_PASSWORD" "$KEYCHAIN_PATH"
          security find-identity -p codesigning "$KEYCHAIN_PATH"

      - name: Resolve version
        id: v
        run: echo "version=$(grep -Eo 'static let version = \"[^\"]+\"' Sources/BoardClip/App/AppInfo.swift | sed -E 's/.*\"([^\"]+)\".*/\1/')" >> "$GITHUB_OUTPUT"

      - name: Build DMG
        run: ./Scripts/make-dmg.sh release

      - name: Sign appcast (EdDSA)
        run: |
          ./Scripts/sign-update.sh tools   # fetch the Sparkle CLI tools
          TOOLS=.build/sparkle-tools/bin
          mkdir -p updates
          cp build/BoardClip-*.dmg updates/
          printf '%s' "$SPARKLE_KEY" > ed_key
          "$TOOLS/generate_appcast" --ed-key-file ed_key \
            --download-url-prefix "https://github.com/${{ github.repository }}/releases/download/${{ github.ref_name }}/" \
            updates/
          cp updates/appcast.xml build/appcast.xml
          rm -f ed_key

      - name: Verify release assets
        run: |
          test -s build/appcast.xml
          test -f "build/BoardClip-${{ steps.v.outputs.version }}.dmg"
          hdiutil verify "build/BoardClip-${{ steps.v.outputs.version }}.dmg"
          grep -q "sparkle:edSignature" build/appcast.xml

      - name: Create GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ github.ref_name }}
        run: |
          ASSETS=(build/BoardClip-*.dmg)
          [ -f build/appcast.xml ] && ASSETS+=(build/appcast.xml)
          gh release create "$TAG" "${ASSETS[@]}" \
            --title "BoardClip ${{ steps.v.outputs.version }}" --generate-notes \
            || gh release upload "$TAG" "${ASSETS[@]}" --clobber

# ── Optional: notarize for a Gatekeeper-clean first launch ──────────────────
# With a paid Apple Developer account add secrets APPLE_DEVELOPER_ID_P12 (base64),
# APPLE_DEVELOPER_ID_P12_PASSWORD, APPLE_NOTARY_KEY/_KEY_ID/_ISSUER, then import the cert,
# set BOARDCLIP_SIGN_IDENTITY, and run `xcrun notarytool submit --wait` + `xcrun stapler staple`.
